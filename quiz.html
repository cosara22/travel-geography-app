<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クイズ — Nippon Geo Quest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen">
  <header class="bg-blue-600 text-white shadow">
    <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold">📝 クイズ</h1>
      <a href="index.html" class="text-blue-100 hover:text-white text-sm">← ホーム</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-8">

    <!-- モード選択画面 -->
    <section id="mode-screen">
      <h2 class="text-lg font-bold text-slate-700 mb-4">出題モードを選択</h2>
      <div id="mode-list" class="space-y-3">
        <div class="text-slate-500 text-sm">読み込み中…</div>
      </div>
    </section>

    <!-- クイズ画面 -->
    <section id="quiz-screen" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <button id="back-btn" class="text-slate-500 hover:text-slate-700 text-sm">← モード選択へ</button>
        <span id="quiz-mode-label" class="text-sm font-medium text-slate-600"></span>
      </div>

      <div class="bg-white rounded-lg shadow p-3 mb-4">
        <div class="flex items-center gap-3 text-xs text-slate-600">
          <span>正答率:</span>
          <div class="flex-1 bg-slate-200 rounded h-2 overflow-hidden">
            <div id="score-bar-fill" class="h-full bg-gradient-to-r from-blue-400 to-blue-600 transition-all" style="width:0%"></div>
          </div>
          <span id="score-bar-text" class="font-bold text-blue-600">0 / 0 (0%)</span>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow p-6 mb-4">
        <div id="question-photo" class="hidden mb-3"></div>
        <h3 id="question-text" class="text-lg font-bold text-slate-800 mb-2"></h3>
        <p id="hint-text" class="text-xs text-slate-500"></p>
      </div>

      <div id="choices" class="space-y-2 mb-4"></div>

      <div id="feedback" class="mb-4"></div>

      <button id="next-btn" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition">
        次の問題へ →
      </button>
    </section>
  </main>

  <script src="js/data.js?v=3"></script>
  <script src="js/quiz.js?v=3"></script>
</body>
</html>
