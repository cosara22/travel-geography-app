<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地図 — Nippon Geo Quest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css?v=20">
</head>
<body class="bg-slate-50 min-h-screen">
  <header class="bg-emerald-600 text-white shadow">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold">🗾 地図で確認</h1>
      <a href="index.html" class="text-emerald-100 hover:text-white text-sm">← ホーム</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-6">
    <p class="text-sm text-slate-600 mb-3">都道府県をクリックすると、観光地・温泉・祭り・郷土料理などの詳細を右側に表示します。</p>

    <!-- 操作パネル -->
    <div class="bg-white rounded-lg shadow p-3 mb-4">
      <div class="flex flex-wrap items-center gap-3 mb-2">
        <div id="region-legend" class="flex-1"></div>
      </div>

      <div class="flex flex-wrap items-center gap-3 text-sm">
        <label class="flex items-center gap-2 text-slate-700 bg-slate-50 border rounded px-3 py-1 cursor-pointer hover:bg-slate-100">
          <input type="checkbox" id="toggle-municipalities" class="w-4 h-4 accent-emerald-600">
          <span>🏙️ <strong>市区町村</strong></span>
        </label>
        <span id="municipality-status" class="text-xs text-slate-500"></span>

        <span class="border-l border-slate-300 h-5"></span>

        <label class="flex items-center gap-2 text-slate-700 bg-slate-50 border rounded px-3 py-1 cursor-pointer hover:bg-slate-100">
          <input type="checkbox" id="toggle-pois" class="w-4 h-4 accent-rose-500">
          <span>📍 <strong>観光資源（OSM）</strong></span>
        </label>

        <div class="flex items-center gap-2 text-xs">
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="radio" name="poi-filter" value="yaml" class="accent-amber-500" checked>
            <span>⭐ 注目スポット</span>
          </label>
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="radio" name="poi-filter" value="priority" class="accent-blue-500">
            <span>主要カテゴリ</span>
          </label>
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="radio" name="poi-filter" value="all" class="accent-slate-500">
            <span>全件</span>
          </label>
        </div>
        <span id="poi-status" class="text-xs text-slate-500"></span>
      </div>
    </div>

    <div class="grid lg:grid-cols-5 gap-4">
      <!-- 左: 地図 -->
      <div class="lg:col-span-3 bg-white rounded-lg shadow p-4">
        <svg id="japan-map" class="w-full" style="max-height: 80vh;" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <!-- 右: 詳細パネル -->
      <aside class="lg:col-span-2 bg-white rounded-lg shadow lg:max-h-[80vh] overflow-y-auto">
        <!-- 拡大地図（選択中の県をズームイン表示） -->
        <div id="zoom-map-container" class="zoom-map-sticky">
          <div class="flex items-center justify-between mb-1">
            <h4 id="zoom-map-title" class="text-xs font-bold text-slate-600">🔍 選択県ズーム</h4>
            <div class="flex items-center gap-1">
              <button id="zoom-out-btn" class="zoom-ctrl-btn" title="縮小" aria-label="縮小">−</button>
              <button id="zoom-in-btn" class="zoom-ctrl-btn" title="拡大" aria-label="拡大">＋</button>
              <button id="zoom-reset-btn" class="zoom-ctrl-btn" title="リセット" aria-label="リセット">⤢</button>
            </div>
          </div>
          <div class="relative">
            <svg id="zoom-map" class="w-full bg-slate-50 rounded border border-slate-200 select-none"
                 preserveAspectRatio="xMidYMid meet"></svg>
            <span id="zoom-map-status" class="absolute bottom-1 right-2 text-[10px] text-slate-500 bg-white/70 px-1 rounded"></span>
          </div>
          <p class="text-[10px] text-slate-400 mt-1">ホイールで拡大縮小・ドラッグで移動</p>
        </div>

        <div class="px-5 pb-5 pt-2">
          <div id="detail-panel" class="text-slate-500 text-sm">
            都道府県をクリックしてください。
          </div>
        </div>
      </aside>
    </div>

    <footer class="mt-4 text-xs text-slate-400 px-2 leading-relaxed">
      地図データ: 「国土数値情報（行政区域データ）」（国土交通省）を
      <a class="hover:underline text-slate-500" href="https://github.com/smartnews-smri/japan-topography" target="_blank" rel="noopener">smartnews-smri/japan-topography</a>
      経由で加工して作成 /
      観光資源データ: <a class="hover:underline text-slate-500" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>
      （ODbL）
    </footer>
  </main>

  <script src="js/data.js?v=20"></script>
  <script src="js/coords.js?v=20"></script>
  <script src="js/poi.js?v=20"></script>
  <script src="js/map.js?v=20"></script>
</body>
</html>
